version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dsc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dsc}
      POSTGRES_DB: ${POSTGRES_DB:-dsc_vfs_solvent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dsc} -d ${POSTGRES_DB:-dsc_vfs_solvent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Подключение к PostgreSQL (переопределяется через .env).
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-dsc}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dsc}
      DB_NAME: ${POSTGRES_DB:-dsc_vfs_solvent}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@ashatrov.ru}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Конфиг (RSA-ключи генерируются при первом старте и сохраняются).
      - appdata:/app/config

volumes:
  pgdata:
  appdata: